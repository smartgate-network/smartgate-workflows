name: Validate workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validators
        run: pip install jsonschema pyyaml

      - name: Validate pipelines and skills
        run: python tests/validate.py

      - name: Test install-skills generator
        run: python -m unittest tests.test_install_skills -v

      - name: Dry-run client installs
        run: |
          python scripts/install-skills.py --client cursor --target /tmp/sg-skills --dry-run
          python scripts/install-skills.py --client claude-code --target /tmp/sg-skills --dry-run
