name: deep-reading
template: read
description: Deep-read a single known URL — fetch page content and compress for LLM consumption.
params:
  url:
    type: string
    required: true
    description: 要精读的 http(s) URL
  ratio:
    type: number
    required: false
    default: 0.4
    description: context_gate 压缩比
  goal:
    type: string
    required: false
    description: 压缩前的相关性预筛目标（可选）
steps:
  - tool: smart_fetch
    params:
      url: "{{url}}"
  - tool: smart_context_gate
    params:
      text: "{{steps.0.markdown}}"
      ratio: "{{ratio}}"
      goal: "{{goal}}"
