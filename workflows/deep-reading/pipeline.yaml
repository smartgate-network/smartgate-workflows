name: deep-reading
template: read
description: Deep-read a single known URL — fetch page content and compress for LLM consumption.
params:
  url:
    type: string
    required: true
    description: http(s) URL to deep-read
  ratio:
    type: number
    required: false
    default: 0.4
    description: context_gate compression ratio
  goal:
    type: string
    required: false
    description: Optional relevance pre-filter goal before compression
steps:
  - tool: smart_fetch
    params:
      url: "{{url}}"
  - tool: smart_context_gate
    params:
      text: "{{steps.0.markdown}}"
      ratio: "{{ratio}}"
      goal: "{{goal}}"
