name: usage-report
template: custom
description: Query team token allowance and usage — administrative only, no content production.
params:
  action:
    type: string
    required: true
    enum:
      - check
      - count
    description: check=whether quota allows continuing; count=query usage so far
steps:
  - tool: smart_budget_guard
    params:
      action: "{{action}}"
