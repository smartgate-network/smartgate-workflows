name: remember-and-recall
template: custom
description: Team long-term memory — add, search, get, or delete persisted facts across sessions.
params:
  action:
    type: string
    required: true
    enum:
      - add
      - search
      - get
      - delete
    description: smart_memory operation type
  content:
    type: string
    required: false
    description: Required when action=add; text to store
  query:
    type: string
    required: false
    description: Required when action=search; search keywords
  memory_id:
    type: string
    required: false
    description: Required when action=get or delete
steps:
  - tool: smart_memory
    params:
      action: "{{action}}"
      content: "{{content}}"
      query: "{{query}}"
      memory_id: "{{memory_id}}"
