name: research-agent
template: custom
description: Multi-source research when no definitive URL is available — search, batch fetch, dedup, compress.
params:
  query:
    type: string
    required: true
    description: Research topic or question
  max_results:
    type: integer
    required: false
    default: 5
    description: Maximum number of search results to return
  dedup_threshold:
    type: number
    required: false
    default: 0.85
    description: SemHash deduplication similarity threshold
  ratio:
    type: number
    required: false
    default: 0.4
    description: context_gate compression ratio
  goal:
    type: string
    required: false
    description: Optional context_gate relevance pre-filter goal
steps:
  - tool: smart_search
    params:
      query: "{{query}}"
      max_results: "{{max_results}}"
  - tool: smart_fetch
    params:
      url: "{{item.url}}"
    for_each: "{{steps.0.results}}"
  - tool: smart_dedup
    params:
      texts: "{{steps.1.results}}"
      threshold: "{{dedup_threshold}}"
  - tool: smart_context_gate
    params:
      text: "{{steps.2.deduped_text}}"
      ratio: "{{ratio}}"
      goal: "{{goal}}"
